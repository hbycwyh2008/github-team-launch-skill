name: GitHub Team Launch

on:
  workflow_dispatch:
  push:
    branches: ['**']
  issues:
    types: [opened, edited, assigned, unassigned, closed, reopened]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited, reopened, synchronize, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  page_build:

permissions:
  contents: read
  issues: write
  pull-requests: read
  pages: read

concurrency:
  group: github-team-launch-${{ github.repository }}
  cancel-in-progress: true

jobs:
  exercise:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest

    steps:
      - name: Check progress and post the next step
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoFullName = `${owner}/${repo}`;
            const ownerLogin = owner;
            const exerciseTitle = '🚀 GitHub Team Launch Exercise';

            const featureConfig = {
              html: {
                issueTitle: 'Build HTML structure',
                branch: 'feature-html',
                file: 'index.html'
              },
              css: {
                issueTitle: 'Add page styling',
                branch: 'feature-css',
                file: 'style.css'
              },
              javascript: {
                issueTitle: 'Add JavaScript interaction',
                branch: 'feature-javascript',
                file: 'script.js'
              }
            };

            const stepFiles = {
              1: '.github/steps/1-plan-the-team.md',
              2: '.github/steps/2-clone-and-branch.md',
              3: '.github/steps/3-build-and-open-prs.md',
              4: '.github/steps/4-review-and-revise.md',
              5: '.github/steps/5-merge-and-sync.md',
              6: '.github/steps/6-publish-pages.md',
              7: '.github/steps/7-reflect-and-finish.md'
            };

            const normalize = value => (value || '').trim().toLowerCase().replace(/\s+/g, ' ');
            const meaningfulText = value => (value || '').trim().length >= 15;
            const genericCommitMessages = new Set([
              'update', 'stuff', 'final', 'change', 'changes', 'fix', 'work',
              'commit', 'test', 'done', 'misc', 'asdf', 'wip'
            ]);
            const meaningfulCommitMessage = value => {
              const firstLine = (value || '').split('\n')[0].trim();
              return firstLine.length >= 12 && !genericCommitMessages.has(normalize(firstLine));
            };

            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            if (repoInfo.is_template) {
              core.info('Template source repository detected. Exercise checker stays idle here.');
              return;
            }
            if (repoInfo.owner?.type !== 'User') {
              core.setFailed('This exercise expects the copied repository to be owned by the student Owner/Maintainer personal account.');
              return;
            }

            const defaultBranch = repoInfo.default_branch;
            const { data: defaultRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${defaultBranch}`
            });
            const defaultHeadSha = defaultRef.object.sha.toLowerCase();

            let allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100
            });
            const realIssues = allIssues.filter(item => !item.pull_request);
            const findIssueByTitle = title => realIssues.find(issue => normalize(issue.title) === normalize(title));

            let exerciseIssue = findIssueByTitle(exerciseTitle);
            if (!exerciseIssue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: exerciseTitle,
                body: '# GitHub Team Launch\n\nThe automatic exercise is starting. Follow the newest unlocked step in the comments below.\n\nDo not close this Issue manually.'
              });
              exerciseIssue = created.data;
              core.info(`Created Exercise Issue #${exerciseIssue.number}.`);
            }

            let comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: exerciseIssue.number,
              per_page: 100
            });

            const readRepoText = async (path, ref = defaultBranch) => {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
                if (Array.isArray(data) || !data.content) return '';
                return Buffer.from(data.content, data.encoding || 'base64').toString('utf8');
              } catch (error) {
                core.info(`Could not read ${path}: ${error.message}`);
                return '';
              }
            };

            const ensureStep = async number => {
              const marker = `<!-- team-launch-step:${number} -->`;
              if (comments.some(comment => (comment.body || '').includes(marker))) return;
              const text = await readRepoText(stepFiles[number]);
              if (!text) return;
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: exerciseIssue.number,
                body: `${marker}\n${text}`
              });
              comments.push(created.data);
            };

            await ensureStep(1);

            const issueFor = {};
            for (const [role, config] of Object.entries(featureConfig)) {
              issueFor[role] = findIssueByTitle(config.issueTitle);
            }
            const featureIssuesExist = Object.values(issueFor).every(Boolean);

            // Step 1: feature Issues + public Project evidence comment.
            let projectEvidence = false;
            let projectUrl = '';
            if (featureIssuesExist) {
              const studentComments = comments.filter(comment => comment.user?.login !== 'github-actions[bot]');
              for (const comment of studentComments) {
                const body = comment.body || '';
                const match = body.match(/PROJECT\s+(https:\/\/github\.com\/(?:users|orgs)\/[^/\s]+\/projects\/\d+)/i);
                if (!match) continue;
                const hasAllIssueLinks = Object.values(issueFor).every(issue => body.includes(issue.html_url));
                if (!hasAllIssueLinks) continue;
                try {
                  const response = await fetch(match[1], {
                    redirect: 'follow',
                    headers: { 'User-Agent': 'github-team-launch-checker' }
                  });
                  if (response.ok) {
                    projectEvidence = true;
                    projectUrl = match[1];
                    break;
                  }
                } catch (error) {
                  core.info(`Project evidence URL check failed: ${error.message}`);
                }
              }
            }
            const step1 = featureIssuesExist && projectEvidence;
            if (step1) await ensureStep(2);

            // Step 2: exact feature branches exist.
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });
            const branchNames = new Set(branches.map(branch => branch.name));
            const featureBranchEvidence = Object.values(featureConfig).every(config => branchNames.has(config.branch));
            const step2 = step1 && featureBranchEvidence;
            if (step2) await ensureStep(3);

            // Discover the three feature PRs.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'all',
              per_page: 100
            });
            const pullForBranch = branch => pulls.find(pr => pr.head.ref === branch && pr.base.ref === defaultBranch);
            const prFor = {};
            for (const [role, config] of Object.entries(featureConfig)) {
              prFor[role] = pullForBranch(config.branch);
            }

            const roleUsers = {
              html: prFor.html?.user?.login || null,
              css: prFor.css?.user?.login || null,
              javascript: prFor.javascript?.user?.login || null
            };

            const roleSeparationEvidence = Boolean(
              prFor.html && prFor.css && prFor.javascript &&
              roleUsers.html === ownerLogin &&
              roleUsers.css && roleUsers.javascript &&
              roleUsers.css !== ownerLogin &&
              roleUsers.javascript !== ownerLogin &&
              roleUsers.css !== roleUsers.javascript
            );

            const sameRepoAccessEvidence = Boolean(
              prFor.html?.head?.repo?.full_name === repoFullName &&
              prFor.css?.head?.repo?.full_name === repoFullName &&
              prFor.javascript?.head?.repo?.full_name === repoFullName
            );
            const teamAccessEvidence = roleSeparationEvidence && sameRepoAccessEvidence;

            const assignedTo = (issue, login) => Boolean(
              issue && login && (issue.assignees || []).some(user => user.login === login)
            );
            const issueAssignmentEvidence = Boolean(
              assignedTo(issueFor.html, ownerLogin) &&
              assignedTo(issueFor.css, roleUsers.css) &&
              assignedTo(issueFor.javascript, roleUsers.javascript)
            );

            let prQualityEvidence = true;
            let fileScopeEvidence = true;
            let meaningfulCommitEvidence = true;
            let localCommitEvidence = true;
            const prCommits = {};

            for (const [role, config] of Object.entries(featureConfig)) {
              const pr = prFor[role];
              const issue = issueFor[role];
              if (!pr || !issue) {
                prQualityEvidence = false;
                fileScopeEvidence = false;
                meaningfulCommitEvidence = false;
                localCommitEvidence = false;
                continue;
              }

              const body = pr.body || '';
              const hasSections = /what changed/i.test(body) && /why/i.test(body) && /testing/i.test(body);
              const closesIssue = new RegExp(`\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+#${issue.number}\\b`, 'i').test(body);
              const titleGood = (pr.title || '').trim().length >= 12;
              if (!(body.trim().length >= 80 && hasSections && closesIssue && titleGood)) prQualityEvidence = false;

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              });
              const names = new Set(files.map(file => file.filename));
              const otherSourceFiles = Object.values(featureConfig)
                .map(item => item.file)
                .filter(file => file !== config.file);
              const correctScope = names.has(config.file) && otherSourceFiles.every(file => !names.has(file));
              if (!correctScope) fileScopeEvidence = false;

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              });
              prCommits[role] = commits;

              const hasMeaningfulCommit = commits.some(commit => meaningfulCommitMessage(commit.commit?.message));
              const hasLocalStyleCommit = commits.some(commit =>
                meaningfulCommitMessage(commit.commit?.message) &&
                commit.committer?.login !== 'web-flow' &&
                normalize(commit.commit?.committer?.name) !== 'github'
              );
              if (!hasMeaningfulCommit) meaningfulCommitEvidence = false;
              if (!hasLocalStyleCommit) localCommitEvidence = false;
            }

            const allPrEvidence = Object.values(prFor).every(Boolean);
            const step3 = step2 && allPrEvidence && teamAccessEvidence && issueAssignmentEvidence &&
              prQualityEvidence && fileScopeEvidence && meaningfulCommitEvidence && localCommitEvidence;
            if (step3) await ensureStep(4);

            // Step 4: Owner reviews both collaborator PRs and at least one has a true feedback cycle.
            let ownerReviewEvidence = true;
            let feedbackCycleEvidence = false;
            for (const role of ['css', 'javascript']) {
              const pr = prFor[role];
              if (!pr) {
                ownerReviewEvidence = false;
                continue;
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              });
              const inlineComments = await github.paginate(github.rest.pulls.listReviewComments, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              });

              const substantiveReview = reviews.some(review =>
                review.user?.login === ownerLogin &&
                ['APPROVED', 'CHANGES_REQUESTED', 'COMMENTED'].includes(review.state) &&
                meaningfulText(review.body)
              ) || inlineComments.some(comment =>
                comment.user?.login === ownerLogin && meaningfulText(comment.body)
              );
              if (!substantiveReview) ownerReviewEvidence = false;

              const changeRequests = reviews
                .filter(review =>
                  review.user?.login === ownerLogin &&
                  review.state === 'CHANGES_REQUESTED' &&
                  review.submitted_at &&
                  meaningfulText(review.body)
                )
                .map(review => new Date(review.submitted_at).getTime());

              const commits = prCommits[role] || [];
              const laterCommit = changeRequests.some(requestTime =>
                commits.some(commit => {
                  const when = new Date(commit.commit?.author?.date || commit.commit?.committer?.date || 0).getTime();
                  return when > requestTime;
                })
              );
              if (laterCommit) feedbackCycleEvidence = true;
            }

            const step4 = step3 && ownerReviewEvidence && feedbackCycleEvidence;
            if (step4) await ensureStep(5);

            // Step 5: Owner merges all PRs, feature Issues close, and all three users prove local sync.
            const mergedEvidence = Object.values(prFor).every(pr => Boolean(pr?.merged_at));
            const issuesClosedEvidence = Object.values(issueFor).every(issue => issue?.state === 'closed');
            let ownerMergeEvidence = false;
            if (mergedEvidence) {
              const fullPrs = await Promise.all(Object.values(prFor).map(pr =>
                github.rest.pulls.get({ owner, repo, pull_number: pr.number })
              ));
              ownerMergeEvidence = fullPrs.every(result => result.data.merged_by?.login === ownerLogin);
            }

            const participants = roleSeparationEvidence
              ? [ownerLogin, roleUsers.css, roleUsers.javascript]
              : [];
            const latestMergeTime = mergedEvidence
              ? Math.max(...Object.values(prFor).map(pr => new Date(pr.merged_at).getTime()))
              : 0;

            const exerciseComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: exerciseIssue.number,
              per_page: 100
            });
            comments = exerciseComments;

            let syncEvidence = false;
            if (participants.length === 3 && mergedEvidence) {
              syncEvidence = participants.every(login =>
                comments.some(comment => {
                  if (comment.user?.login !== login) return false;
                  if (new Date(comment.created_at).getTime() < latestMergeTime) return false;
                  const match = (comment.body || '').trim().match(/^SYNCED\s+([0-9a-f]{7,40})\b/i);
                  if (!match) return false;
                  return defaultHeadSha.startsWith(match[1].toLowerCase());
                })
              );
            }

            // Validate integrated source on main.
            const html = await readRepoText('index.html');
            const css = await readRepoText('style.css');
            const js = await readRepoText('script.js');
            const htmlEvidence = html.length >= 250 &&
              !/under construction/i.test(html) &&
              /href=["']style\.css["']/i.test(html) &&
              /src=["']script\.js["']/i.test(html) &&
              /<(main|header|section|article)\b/i.test(html);
            const cssRuleCount = (css.match(/\{/g) || []).length;
            const cssEvidence = css.length >= 180 && cssRuleCount >= 3;
            const jsEvidence = js.length >= 120 &&
              !/TODO/i.test(js) &&
              /addEventListener\s*\(/.test(js) &&
              /(textContent|innerText|classList|style\.)/.test(js);
            const codeEvidence = htmlEvidence && cssEvidence && jsEvidence;

            const step5 = step4 && mergedEvidence && issuesClosedEvidence && ownerMergeEvidence && syncEvidence && codeEvidence;
            if (step5) await ensureStep(6);

            // Step 6: Pages exists and the live assets respond.
            let pagesUrl = '';
            let liveSiteEvidence = false;
            try {
              const { data: pages } = await github.rest.repos.getPages({ owner, repo });
              pagesUrl = pages?.html_url || '';
              if (pagesUrl) {
                const urls = [
                  pagesUrl,
                  new URL('style.css', pagesUrl).href,
                  new URL('script.js', pagesUrl).href
                ];
                const responses = await Promise.all(urls.map(url => fetch(url, {
                  redirect: 'follow',
                  headers: { 'User-Agent': 'github-team-launch-checker' }
                })));
                if (responses.every(response => response.ok)) {
                  const [liveHtml, liveCss, liveJs] = await Promise.all(responses.map(response => response.text()));
                  liveSiteEvidence = /style\.css/i.test(liveHtml) &&
                    /script\.js/i.test(liveHtml) &&
                    liveCss.length >= 180 &&
                    /addEventListener\s*\(/.test(liveJs);
                }
              }
            } catch (error) {
              core.info(`Pages is not ready: ${error.message}`);
            }

            const step6 = step5 && liveSiteEvidence;
            if (step6) await ensureStep(7);

            // Step 7: all three participants submit a structurally valid reflection.
            let reflectionEvidence = false;
            if (participants.length === 3) {
              const conceptPattern = /(branch|commit|push|pull request|review|merge|local|remote)/gi;
              reflectionEvidence = participants.every(login =>
                comments.some(comment => {
                  if (comment.user?.login !== login) return false;
                  const body = (comment.body || '').trim();
                  if (!/^REFLECTION:/i.test(body) || body.length < 120) return false;
                  const concepts = new Set((body.match(conceptPattern) || []).map(value => value.toLowerCase()));
                  return concepts.size >= 2;
                })
              );
            }
            const step7 = step6 && reflectionEvidence;

            const states = [step1, step2, step3, step4, step5, step6, step7];
            const labels = [
              'Plan team, Issues, and Project evidence',
              'Clone and create feature branches',
              'Build locally and open quality PRs',
              'Review and complete a feedback cycle',
              'Owner merges, close Issues, and sync main',
              'Publish and verify GitHub Pages',
              'Submit three reflections'
            ];
            const passed = states.filter(Boolean).length;
            const nextStep = states.findIndex(value => !value) + 1;

            const dashboard = [
              '# 🚀 GitHub Team Launch',
              '',
              `**Progress:** ${passed}/7 steps complete`,
              '',
              ...labels.map((label, index) => `${states[index] ? '✅' : '⬜'} Step ${index + 1} — ${label}`),
              '',
              step7
                ? '## 🏆 Exercise complete\nAll automatic checks passed.'
                : `## Current mission\nComplete **Step ${nextStep}** using the newest unlocked instruction comment below.`,
              '',
              projectUrl ? `**Project evidence:** ${projectUrl}` : '',
              pagesUrl ? `**Published site:** ${pagesUrl}` : '',
              '',
              '> Do not close this Issue manually. The workflow closes it when the exercise is complete.'
            ].filter(Boolean).join('\n');

            if ((exerciseIssue.body || '') !== dashboard) {
              const updated = await github.rest.issues.update({
                owner,
                repo,
                issue_number: exerciseIssue.number,
                body: dashboard,
                state: step7 ? 'closed' : 'open',
                state_reason: step7 ? 'completed' : undefined
              });
              exerciseIssue = updated.data;
            } else if (step7 && exerciseIssue.state !== 'closed') {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: exerciseIssue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

            if (step7) {
              const completionMarker = '<!-- team-launch-complete -->';
              if (!comments.some(comment => (comment.body || '').includes(completionMarker))) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: exerciseIssue.number,
                  body: `${completionMarker}\n## 🏆 GitHub Team Launch complete\n\nAll seven stages and the automatic validation checks passed. Your team completed the full collaboration workflow and published the integrated site.`
                });
              }
            }
